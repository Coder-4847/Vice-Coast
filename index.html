<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1114" />
    <title>Vice Coast</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="hud">
      <div id="fps" hidden></div>
      <div id="device"></div>
      <div id="hint"></div>
    </div>
    <div id="touch" hidden>
      <div class="stick" id="stick-move"><div class="knob"></div></div>
      <div class="stick" id="stick-look"><div class="knob"></div></div>
      <button class="tbtn" id="tbtn-jump">Jump</button>
    </div>
    <div id="settings" class="panel" hidden>
      <h2>Settings</h2>
      <label>Quality
        <select id="set-quality">
          <option value="auto">Auto</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="ultra">Ultra</option>
        </select>
      </label>
      <label>Resolution scale <span id="set-scale-val"></span>
        <input id="set-scale" type="range" min="0.5" max="1" step="0.05" />
      </label>
      <label>Mouse sensitivity <span id="set-sens-val"></span>
        <input id="set-sens" type="range" min="0.2" max="3" step="0.1" />
      </label>
      <label class="row"><input id="set-fps" type="checkbox" /> Show FPS</label>
      <label class="row"><input id="set-reduce" type="checkbox" /> Reduce motion</label>
      <button id="set-close">Close</button>
    </div>
    <div id="fatal" class="panel" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
